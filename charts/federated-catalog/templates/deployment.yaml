---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dse.fullname" . }}
  labels:
    {{- include "dse.federatedcatalog.labels" . | nindent 4 }}
spec:
  {{- if not .Values.federatedcatalog.autoscaling.enabled }}
  replicas: {{ .Values.federatedcatalog.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dse.federatedcatalog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.federatedcatalog.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dse.federatedcatalog.selectorLabels" . | nindent 8 }}
        {{- with .Values.federatedcatalog.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dse.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.federatedcatalog.podSecurityContext | nindent 8 }}
      initContainers:
        {{- tpl (toYaml .Values.federatedcatalog.initContainers) . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.federatedcatalog.securityContext | nindent 12 }}

          # either use the specified image, or use the default one
          image: {{ include "dse.federatedcatalog.image.repository" . | trim }}:{{ .Values.federatedcatalog.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.federatedcatalog.image.pullPolicy }}
          ports:
          {{- range $key,$value := .Values.federatedcatalog.endpoints }}
            - name: {{ $key }}
              containerPort: {{ $value.port }}
              protocol: TCP
          {{- end }}
          {{- if .Values.federatedcatalog.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.federatedcatalog.endpoints.default.path }}/check/liveness
              port: {{ .Values.federatedcatalog.endpoints.default.port }}
              scheme: {{ if .Values.federatedcatalog.internalTls.enabled }}HTTPS{{ else }}HTTP{{ end }}
              httpHeaders:
                - name: Host
                  value: {{include "dse.fullname" .}}
            initialDelaySeconds: {{ .Values.federatedcatalog.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.federatedcatalog.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.federatedcatalog.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.federatedcatalog.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.federatedcatalog.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.federatedcatalog.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.federatedcatalog.endpoints.default.path }}/check/liveness
              port: {{ .Values.federatedcatalog.endpoints.default.port }}
              scheme: {{ if .Values.federatedcatalog.internalTls.enabled }}HTTPS{{ else }}HTTP{{ end }}
              httpHeaders:
                - name: Host
                  value: {{include "dse.fullname" .}}
            initialDelaySeconds: {{ .Values.federatedcatalog.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.federatedcatalog.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.federatedcatalog.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.federatedcatalog.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.federatedcatalog.startupProbe.successThreshold }}
          {{- end }}
          {{- if .Values.federatedcatalog.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.federatedcatalog.endpoints.default.path }}/check/readiness
              port: {{ .Values.federatedcatalog.endpoints.default.port }}
              scheme: {{ if .Values.federatedcatalog.internalTls.enabled }}HTTPS{{ else }}HTTP{{ end }}
              httpHeaders:
                - name: Host
                  value: {{include "dse.fullname" .}}
            initialDelaySeconds: {{ .Values.federatedcatalog.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.federatedcatalog.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.federatedcatalog.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.federatedcatalog.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.federatedcatalog.readinessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.federatedcatalog.resources | nindent 12 }}
          env:
          ######################
          ## FS CONFIGURATION ##
          ######################
          - name: "EDC_FS_CONFIG"
            value: /app/config.properties

          ######################
          ## ID CONFIGURATION ##
          ######################
          - name: "EDC_PARTICIPANT_ID"
            value: {{ include "dse.federatedcatalog.didWebUrl" . | quote }}
          - name: "EDC_COMPONENT_ID"
            value: {{ include "dse.fullname" .}}
        {{- if .Values.federatedcatalog.internalTls.enabled }}
          - name: "EDC_WEB_HTTPS_KEYSTORE_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.federatedcatalog.internalTls.keystoreSecretName | required ".Values.federatedcatalog.internalTls.keystoreSecretName is required when internalTls.enabled" | quote }}
                key: {{ .Values.federatedcatalog.internalTls.keystoreSecretPasswordKey | quote }}
          - name: "EDC_WEB_HTTPS_KEYMANAGER_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: {{ .Values.federatedcatalog.internalTls.keystoreSecretName | required ".Values.federatedcatalog.internalTls.keystoreSecretName is required when internalTls.enabled" | quote }}
                key: {{ .Values.federatedcatalog.internalTls.keystoreSecretPasswordKey | quote }}
        {{- end }}

          #######
          # DSP #
          #######
          - name: "EDC_DSP_CALLBACK_ADDRESS"
            value: {{ include "dse.federatedcatalog.url.protocol" .}}

          ##############
          # POSTGRESQL #
          ##############
          - name: "EDC_SQL_SCHEMA_AUTOCREATE"
            value: {{.Values.federatedcatalog.postgresql.schema.autocreate | required ".Values.federatedcatalog.postgresql.schema.autocreate is required" | quote}}

        {{- with .Values.federatedcatalog.postgresql }}
        {{- if or .jdbcUrl $.Values.global.db.serverFqdn }}
          - name: "EDC_DATASOURCE_DEFAULT_URL"
            value: {{ include "dse.federatedcatalog.postgresql.jdbcUrl" $ | quote }}
          - name: "EDC_DATASOURCE_DEFAULT_USER"
            valueFrom:
              secretKeyRef:
                name: {{ include "dse.federatedcatalog.postgresql.secretName" $ | quote }}
                key: {{ .credentials.secret.userKey | required ".credentials.secret.userKey is required" | quote }}
          - name: "EDC_DATASOURCE_DEFAULT_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: {{ include "dse.federatedcatalog.postgresql.secretName" $ | quote }}
                key: {{ .credentials.secret.passwordKey | required ".credentials.secret.passwordKey is required" | quote }}
        {{- end }}
        {{- end }}

            #####################
            ## HASHICORP VAULT ##
            #####################
          {{- $vaultUrl := include "dse.federatedcatalog.vault.hashicorp.url" . }}
          {{- if $vaultUrl }}
            # https://github.com/eclipse-edc/Connector/tree/main/extensions/common/vault/vault-hashicorp
          - name: "EDC_VAULT_HASHICORP_URL"
            value: {{ $vaultUrl | quote }}
          - name: "EDC_VAULT_HASHICORP_TOKEN"
            valueFrom:
              secretKeyRef:
                name: {{ include "dse.federatedcatalog.vault.hashicorp.tokenSecretName" . | quote }}
                key: {{ .Values.federatedcatalog.vault.hashicorp.token.secret.tokenKey | required ".Values.federatedcatalog.vault.hashicorp.token.secret.tokenKey is required" | quote }}
          - name: "EDC_VAULT_HASHICORP_TOKEN_SCHEDULED-RENEW-ENABLED"
            value: {{ .Values.federatedcatalog.vault.hashicorp.token.renewal.enabled | quote }}
          - name: "EDC_VAULT_HASHICORP_TOKEN_RENEW-BUFFER"
            value: {{ .Values.federatedcatalog.vault.hashicorp.token.renewal.renewBuffer | quote }}
          - name: "EDC_VAULT_HASHICORP_TOKEN_TTL"
            value: {{ .Values.federatedcatalog.vault.hashicorp.token.renewal.ttl | quote }}
          - name: "EDC_VAULT_HASHICORP_TIMEOUT_SECONDS"
            value: {{ .Values.federatedcatalog.vault.hashicorp.timeout | quote }}
          - name: "EDC_VAULT_HASHICORP_HEALTH_CHECK_ENABLED"
            value: {{ .Values.federatedcatalog.vault.hashicorp.healthCheck.enabled | quote }}
          - name: "EDC_VAULT_HASHICORP_HEALTH_CHECK_STANDBY_OK"
            value: {{ .Values.federatedcatalog.vault.hashicorp.healthCheck.standbyOk | quote }}
          - name: "EDC_VAULT_HASHICORP_API_SECRET_PATH"
            value: {{ .Values.federatedcatalog.vault.hashicorp.paths.secret | quote }}
          - name: "EDC_VAULT_HASHICORP_FOLDER"
            value: {{ include "dse.federatedcatalog.vault.hashicorp.folder" . | quote }}
          - name: "EDC_VAULT_HASHICORP_API_HEALTH_CHECK_PATH"
            value: {{ .Values.federatedcatalog.vault.hashicorp.paths.health | quote }}
          - name: "EDC_VAULT_HASHICORP_ALLOW_FALLBACK"
            value: {{ .Values.federatedcatalog.vault.hashicorp.allowFallback | quote }}
          {{- end }}

          ###############
          # AZURE VAULT #
          ###############
          {{- if eq (include "dse.federatedcatalog.vaultAzureEnabled" .) "true" }}
          - name: "EDC_VAULT_NAME"
            value: {{ include "dse.federatedcatalog.vaultAzureName" . | required ".Values.federatedcatalog.vault.azure.name or global.vault.azure.name (with global.vaultProvider=azure/azurevault) is required" | quote }}
            {{- if or .Values.federatedcatalog.vault.azure.url .Values.global.vault.azure.url }}
          - name: "EDC_VAULT_URL_OVERRIDE"
            value: {{ include "dse.federatedcatalog.vaultAzureUrl" . | quote }}
          - name: "EDC_VAULT_URL_OVERRIDE_UNSAFE"
            value: {{ include "dse.federatedcatalog.vaultAzureUnsafe" . | quote }}
            {{- end }}
          - name: "AZURE_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: {{ include "dse.federatedcatalog.vaultAzureCredentialsSecretName" . | required ".Values.federatedcatalog.vault.azure.credentials.secret.name or global.vault.azure.credentials.secret.name is required" | quote }}
                key: {{ include "dse.federatedcatalog.vaultAzureCredentialsClientIdKey" . | required ".Values.federatedcatalog.vault.azure.credentials.secret.clientIdKey or global.vault.azure.credentials.secret.clientIdKey is required" | quote }}
          - name: "AZURE_TENANT_ID"
            valueFrom:
              secretKeyRef:
                name: {{ include "dse.federatedcatalog.vaultAzureCredentialsSecretName" . | required ".Values.federatedcatalog.vault.azure.credentials.secret.name or global.vault.azure.credentials.secret.name is required" | quote }}
                key: {{ include "dse.federatedcatalog.vaultAzureCredentialsTenantIdKey" . | required ".Values.federatedcatalog.vault.azure.credentials.secret.tenantIdKey or global.vault.azure.credentials.secret.tenantIdKey is required" | quote }}
            {{- if or .Values.federatedcatalog.vault.azure.credentials.secret.clientSecretKey .Values.global.vault.azure.credentials.secret.clientSecretKey }}
          - name: "AZURE_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: {{ include "dse.federatedcatalog.vaultAzureCredentialsSecretName" . | quote }}
                key: {{ include "dse.federatedcatalog.vaultAzureCredentialsClientSecretKey" . | quote }}
            {{- end }}
            {{- if or .Values.federatedcatalog.vault.azure.credentials.secret.clientCertificateKey .Values.global.vault.azure.credentials.secret.clientCertificateKey }}
          - name: "AZURE_CLIENT_CERTIFICATE_PATH"
            # AzureVaultExtension/ClientCertificateCredential reads this as a
            # file path, not raw cert content, so the cert is mounted as a
            # volume (azure-vault-cert-volume, below) instead of injected via
            # secretKeyRef.
            value: {{ printf "/azure-vault-cert/%s" (include "dse.federatedcatalog.vaultAzureCredentialsClientCertificateKey" .) | quote }}
            {{- end }}
          {{- end }}

            #############################
            # FEDERATED CATALOG CRAWLER #
            #############################
          - name: "EDC_CATALOG_CACHE_LOADER_BATCH_SIZE"
            value: {{ .Values.federatedcatalog.crawler.cache.loaderBatchSize | required ".Values.federatedcatalog.crawler.cache.loaderBatchSize is required" | quote }}
          - name: "EDC_CATALOG_CACHE_EXECUTION_DELAY_SECONDS"
            value: {{ .Values.federatedcatalog.crawler.cache.executionDelaySeconds | required ".Values.federatedcatalog.crawler.cache.executionDelaySeconds is required" | quote }}
          - name: "EDC_CATALOG_CACHE_EXECUTION_PERIOD_SECONDS"
            value: {{ .Values.federatedcatalog.crawler.cache.executionPeriodSeconds | required ".Values.federatedcatalog.crawler.cache.executionPeriodSeconds is required" | quote }}

          #######
          # DID #
          #######
          - name: "EDC_IAM_ISSUER_ID"
            value: {{ include "dse.federatedcatalog.didWebUrl" . | quote }}
          - name: "EDC_IDENTITY_DID_URL"
            value: {{ include "dse.federatedcatalog.didWebUrl" . | quote }}
          - name: "EDC_IAM_DID_WEB_USE_HTTPS"
            value: {{ include "dse.federatedcatalog.didWebUseHttps" . | quote }}

          #####################
          # STS REMOTE CONFIG #
          #####################
          - name: "EDC_IAM_STS_OAUTH_TOKEN_URL"
            value: {{ include "dse.federatedcatalog.sts.tokenUrl" . | quote }}
          - name: "EDC_IAM_STS_OAUTH_CLIENT_ID"
            value: {{ include "dse.federatedcatalog.sts.clientId" . | quote }}
          - name: "EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS"
            value: {{ include "dse.federatedcatalog.sts.clientSecretAlias" . | quote }}

          ################
          # ENCRYPTION   #
          ################
          # -- required since EDC 0.16.0's encryption-algorithm registry
          # (https://github.com/eclipse-edc/Connector/pull/5423); without it
          # participant-context creation fails.
          - name: "EDC_ENCRYPTION_AES_KEY_ALIAS"
            value: {{ include "dse.federatedcatalog.keys.encryption.aesKeyAlias" . | quote }}

          #######
          # API #
          #######
          - name: "EDC_WEB_REST_CORS_ENABLED"
            value: {{.Values.federatedcatalog.api.cors.enabled | required ".Values.federatedcatalog.api.cors.enabled is required" | quote}}
          - name: "EDC_WEB_REST_CORS_HEADERS"
            value: {{.Values.federatedcatalog.api.cors.allowedHeaders | required ".Values.federatedcatalog.api.cors.allowedHeaders is required" | quote}}

        {{- range $key, $value := .Values.federatedcatalog.envValueFrom }}
          - name: {{ $key | quote }}
            valueFrom:
              {{- tpl (toYaml $value) $ | nindent 16 }}
        {{- end }}
        {{- range $key, $value := .Values.federatedcatalog.env }}
          - name: {{ $key | quote }}
            value: {{ $value | quote }}
        {{- end }}
          {{- if and (or .Values.federatedcatalog.envSecretNames .Values.federatedcatalog.envConfigMapNames) (or (gt (len .Values.federatedcatalog.envSecretNames) 0) (gt (len .Values.federatedcatalog.envConfigMapNames) 0)) }}
          envFrom:
          {{- range $value := .Values.federatedcatalog.envSecretNames }}
            - secretRef:
                name: {{ $value | quote }}
          {{- end }}
          {{- range $value := .Values.federatedcatalog.envConfigMapNames }}
            - configMapRef:
                name: {{ $value | quote }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/logging.properties
              subPath: logging.properties
            - name: config
              mountPath: /app/opentelemetry.properties
              subPath: opentelemetry.properties
            - name: config
              mountPath: /app/config.properties
              subPath: config.properties
            - name: shared-volume
              readOnly: true
              mountPath: /shared
{{- if .Values.federatedcatalog.internalTls.enabled }}
            - name: internal-tls-volume
              mountPath: /internal-certs
{{- end }}
{{- if and (eq (include "dse.federatedcatalog.vaultAzureEnabled" .) "true") (or .Values.federatedcatalog.vault.azure.credentials.secret.clientCertificateKey .Values.global.vault.azure.credentials.secret.clientCertificateKey) }}
            - name: azure-vault-cert-volume
              readOnly: true
              mountPath: /azure-vault-cert
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dse.fullname" . }}-config
            items:
              - key: logging.properties
                path: logging.properties
              - key: opentelemetry.properties
                path: opentelemetry.properties
              - key: config.properties
                path: config.properties
        - name: shared-volume
          emptyDir: { }
{{- if .Values.federatedcatalog.internalTls.enabled }}
        - name: internal-tls-volume
          secret:
            secretName: {{ .Values.federatedcatalog.internalTls.secretName }}
{{- end }}
{{- if and (eq (include "dse.federatedcatalog.vaultAzureEnabled" .) "true") (or .Values.federatedcatalog.vault.azure.credentials.secret.clientCertificateKey .Values.global.vault.azure.credentials.secret.clientCertificateKey) }}
        - name: azure-vault-cert-volume
          secret:
            secretName: {{ include "dse.federatedcatalog.vaultAzureCredentialsSecretName" . | quote }}
            items:
              - key: {{ include "dse.federatedcatalog.vaultAzureCredentialsClientCertificateKey" . | quote }}
                path: {{ include "dse.federatedcatalog.vaultAzureCredentialsClientCertificateKey" . | quote }}
{{- end }}

      {{- with .Values.federatedcatalog.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.federatedcatalog.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.federatedcatalog.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}