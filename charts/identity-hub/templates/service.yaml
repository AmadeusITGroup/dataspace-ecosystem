apiVersion: v1
kind: Service
metadata:
  {{- with .Values.identityhub.service.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  name: {{ include "dse.fullname" . }}
  namespace: {{ .Release.Namespace | default "default" | quote }}
  labels:
    {{- include "dse.labels" . | nindent 4 }}
    {{- include "dse.identityhub.extraLabels" (dict "labels" .Values.identityhub.service.labels "context" $) | nindent 4 }}
spec:
  type: {{ .Values.identityhub.service.type }}
  ports:
    {{- range $key,$value := .Values.identityhub.endpoints }}
    - name: {{ $key }}
      targetPort: {{ $key }}
      port: {{ $value.port }}
      protocol: TCP
    {{- end }}
    # DID endpoint on the default port of the did:web scheme: the DID carries no port
    - name: did-web
      targetPort: did
      port: {{ include "dse.identityhub.did.web.servicePort" . }}
      protocol: TCP
    {{- if .Values.global.telemetry.enabled }}
    - name: metrics
      targetPort: metrics
      port: 9464
      protocol: TCP
    {{- end }}
  selector:
    {{- include "dse.identityhub.selectorLabels" . | nindent 4 }}
