---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dse.fullname" . }}
  labels:
    {{- include "dse.telemetryservice.labels" . | nindent 4 }}
spec:
  {{- if not .Values.telemetryservice.autoscaling.enabled }}
  replicas: {{ .Values.telemetryservice.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dse.telemetryservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.telemetryservice.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dse.telemetryservice.selectorLabels" . | nindent 8 }}
        {{- with .Values.telemetryservice.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dse.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.telemetryservice.podSecurityContext | nindent 8 }}
      initContainers:
        {{- tpl (toYaml .Values.telemetryservice.initContainers) . | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.telemetryservice.securityContext | nindent 12 }}
          # either use the specified image, or use the default one
          image: {{ include "dse.telemetryservice.image.repository" . | trim }}:{{ .Values.telemetryservice.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.telemetryservice.image.pullPolicy }}
          ports:
          {{- range $key,$value := .Values.telemetryservice.endpoints }}
            - name: {{ $key }}
              containerPort: {{ $value.port }}
              protocol: TCP
          {{- end }}
          {{- if .Values.telemetryservice.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.telemetryservice.endpoints.default.path }}/check/liveness
              port: {{ .Values.telemetryservice.endpoints.default.port }}
              scheme: {{ if .Values.telemetryservice.internalTls.enabled }}HTTPS{{ else }}HTTP{{ end }}
              httpHeaders:
                - name: Host
                  value: {{include "dse.fullname" .}}
            initialDelaySeconds: {{ .Values.telemetryservice.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.telemetryservice.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.telemetryservice.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.telemetryservice.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.telemetryservice.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.telemetryservice.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.telemetryservice.endpoints.default.path }}/check/liveness
              port: {{ .Values.telemetryservice.endpoints.default.port }}
              scheme: {{ if .Values.telemetryservice.internalTls.enabled }}HTTPS{{ else }}HTTP{{ end }}
              httpHeaders:
                - name: Host
                  value: {{include "dse.fullname" .}}
            periodSeconds: {{ .Values.telemetryservice.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.telemetryservice.startupProbe.failureThreshold }}
            timeoutSeconds: {{ .Values.telemetryservice.startupProbe.timeoutSeconds }}
            successThreshold: {{ .Values.telemetryservice.startupProbe.successThreshold }}
          {{- end }}
          {{- if .Values.telemetryservice.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.telemetryservice.endpoints.default.path }}/check/readiness
              port: {{ .Values.telemetryservice.endpoints.default.port }}
              scheme: {{ if .Values.telemetryservice.internalTls.enabled }}HTTPS{{ else }}HTTP{{ end }}
              httpHeaders:
                - name: Host
                  value: {{include "dse.fullname" .}}
            initialDelaySeconds: {{ .Values.telemetryservice.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.telemetryservice.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.telemetryservice.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.telemetryservice.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.telemetryservice.readinessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.telemetryservice.resources | nindent 12 }}
          env:
            ######################
            ## FS CONFIGURATION ##
            ######################
            - name: "EDC_FS_CONFIG"
              value: /app/config.properties

            - name: "EDC_IAM_DID_WEB_USE_HTTPS"
              value: {{ include "dse.telemetryservice.didWebUseHttps" . | quote }}

            - name: "EDC_PARTICIPANT_ID"
              value: {{ include "dse.telemetryservice.didWebUrl" . | quote }}



            ######################
            ## ID CONFIGURATION ##
            ######################
            - name: "EDC_COMPONENT_ID"
              value: {{ include "dse.fullname" .}}
          {{- if .Values.telemetryservice.internalTls.enabled }}
            - name: "EDC_WEB_HTTPS_KEYSTORE_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetryservice.internalTls.keystoreSecretName | required ".Values.telemetryservice.internalTls.keystoreSecretName is required when internalTls.enabled" | quote }}
                  key: {{ .Values.telemetryservice.internalTls.keystoreSecretPasswordKey | quote }}
            - name: "EDC_WEB_HTTPS_KEYMANAGER_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetryservice.internalTls.keystoreSecretName | required ".Values.telemetryservice.internalTls.keystoreSecretName is required when internalTls.enabled" | quote }}
                  key: {{ .Values.telemetryservice.internalTls.keystoreSecretPasswordKey | quote }}
          {{- end }}

          ##############
          # POSTGRESQL #
          ##############
            - name: "EDC_SQL_SCHEMA_AUTOCREATE"
              value: {{ .Values.telemetryservice.postgresql.schema.autocreate | required ".Values.telemetryservice.postgresql.schema.autocreate is required" | quote }}

            {{- with .Values.telemetryservice.postgresql }}
            {{- if or .jdbcUrl $.Values.global.db.serverFqdn }}
            - name: "EDC_DATASOURCE_DEFAULT_URL"
              value: {{ include "dse.telemetryservice.postgresql.jdbcUrl" $ | quote }}
            - name: "EDC_DATASOURCE_DEFAULT_USER"
              valueFrom:
                secretKeyRef:
                  name: {{ include "dse.telemetryservice.postgresql.secretName" $ | quote }}
                  key: {{ .credentials.secret.userKey | required ".credentials.secret.userKey is required" | quote }}
            - name: "EDC_DATASOURCE_DEFAULT_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: {{ include "dse.telemetryservice.postgresql.secretName" $ | quote }}
                  key: {{ .credentials.secret.passwordKey | required ".credentials.secret.passwordKey is required" | quote }}
            {{- end }}
            {{- end }}
            #####################
            ## HASHICORP VAULT ##
            #####################
          {{- $vaultUrl := include "dse.telemetryservice.vault.hashicorp.url" . }}
          {{- if $vaultUrl }}
            # https://github.com/eclipse-edc/Connector/tree/main/extensions/common/vault/vault-hashicorp
            - name: "EDC_VAULT_HASHICORP_URL"
              value: {{ $vaultUrl | quote }}
            - name: "EDC_VAULT_HASHICORP_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: {{ include "dse.telemetryservice.vault.hashicorp.tokenSecretName" . | quote }}
                  key: {{ .Values.telemetryservice.vault.hashicorp.token.secret.tokenKey | required ".Values.telemetryservice.vault.hashicorp.token.secret.tokenKey is required" | quote }}
            - name: "EDC_VAULT_HASHICORP_TOKEN_SCHEDULED-RENEW-ENABLED"
              value: {{ .Values.telemetryservice.vault.hashicorp.token.renewal.enabled | quote }}
            - name: "EDC_VAULT_HASHICORP_TOKEN_RENEW-BUFFER"
              value: {{ .Values.telemetryservice.vault.hashicorp.token.renewal.renewBuffer | quote }}
            - name: "EDC_VAULT_HASHICORP_TOKEN_TTL"
              value: {{ .Values.telemetryservice.vault.hashicorp.token.renewal.ttl | quote }}
            - name: "EDC_VAULT_HASHICORP_TIMEOUT_SECONDS"
              value: {{ .Values.telemetryservice.vault.hashicorp.timeout | quote }}
            - name: "EDC_VAULT_HASHICORP_HEALTH_CHECK_ENABLED"
              value: {{ .Values.telemetryservice.vault.hashicorp.healthCheck.enabled | quote }}
            - name: "EDC_VAULT_HASHICORP_HEALTH_CHECK_STANDBY_OK"
              value: {{ .Values.telemetryservice.vault.hashicorp.healthCheck.standbyOk | quote }}
            - name: "EDC_VAULT_HASHICORP_API_SECRET_PATH"
              value: {{ .Values.telemetryservice.vault.hashicorp.paths.secret | quote }}
            - name: "EDC_VAULT_HASHICORP_FOLDER"
              value: {{ include "dse.telemetryservice.vault.hashicorp.folder" . | quote }}
            - name: "EDC_VAULT_HASHICORP_API_HEALTH_CHECK_PATH"
              value: {{ .Values.telemetryservice.vault.hashicorp.paths.health | quote }}
            - name: "EDC_VAULT_HASHICORP_ALLOW_FALLBACK"
              value: {{ .Values.telemetryservice.vault.hashicorp.allowFallback | quote }}
          {{- end }}

          ###############
          # AZURE VAULT #
          ###############
          {{- if eq (include "dse.telemetryservice.vaultAzureEnabled" .) "true" }}
            - name: "EDC_VAULT_NAME"
              value: {{ include "dse.telemetryservice.vaultAzureName" . | required ".Values.telemetryservice.vault.azure.name or global.vault.azure.name (with global.vaultProvider=azure/azurevault) is required" | quote }}
            {{- if or .Values.telemetryservice.vault.azure.url .Values.global.vault.azure.url }}
            - name: "EDC_VAULT_URL_OVERRIDE"
              value: {{ include "dse.telemetryservice.vaultAzureUrl" . | quote }}
            - name: "EDC_VAULT_URL_OVERRIDE_UNSAFE"
              value: {{ include "dse.telemetryservice.vaultAzureUnsafe" . | quote }}
            {{- end }}
            - name: "AZURE_CLIENT_ID"
              valueFrom:
                secretKeyRef:
                  name: {{ include "dse.telemetryservice.vaultAzureCredentialsSecretName" . | required ".Values.telemetryservice.vault.azure.credentials.secret.name or global.vault.azure.credentials.secret.name is required" | quote }}
                  key: {{ include "dse.telemetryservice.vaultAzureCredentialsClientIdKey" . | required ".Values.telemetryservice.vault.azure.credentials.secret.clientIdKey or global.vault.azure.credentials.secret.clientIdKey is required" | quote }}
            - name: "AZURE_TENANT_ID"
              valueFrom:
                secretKeyRef:
                  name: {{ include "dse.telemetryservice.vaultAzureCredentialsSecretName" . | required ".Values.telemetryservice.vault.azure.credentials.secret.name or global.vault.azure.credentials.secret.name is required" | quote }}
                  key: {{ include "dse.telemetryservice.vaultAzureCredentialsTenantIdKey" . | required ".Values.telemetryservice.vault.azure.credentials.secret.tenantIdKey or global.vault.azure.credentials.secret.tenantIdKey is required" | quote }}
            {{- if or .Values.telemetryservice.vault.azure.credentials.secret.clientSecretKey .Values.global.vault.azure.credentials.secret.clientSecretKey }}
            - name: "AZURE_CLIENT_SECRET"
              valueFrom:
                secretKeyRef:
                  name: {{ include "dse.telemetryservice.vaultAzureCredentialsSecretName" . | quote }}
                  key: {{ include "dse.telemetryservice.vaultAzureCredentialsClientSecretKey" . | quote }}
            {{- end }}
            {{- if or .Values.telemetryservice.vault.azure.credentials.secret.clientCertificateKey .Values.global.vault.azure.credentials.secret.clientCertificateKey }}
            - name: "AZURE_CLIENT_CERTIFICATE_PATH"
              # AzureVaultExtension/ClientCertificateCredential reads this as
              # a file path, not raw cert content, so the cert is mounted as
              # a volume (azure-vault-cert-volume, below) instead of injected
              # via secretKeyRef.
              value: {{ printf "/azure-vault-cert/%s" (include "dse.telemetryservice.vaultAzureCredentialsClientCertificateKey" .) | quote }}
            {{- end }}
          {{- end }}

            ############################
            # AZURE CREDENTIAL FACTORY #
            ############################
          {{- if .Values.telemetryservice.credentialfactory.azure.eventhub.sas.uri }}
            - name: "DSE_CREDENTIAL-FACTORY_AZURE_EVENT-HUB_SAS_URI"
              value: {{ .Values.telemetryservice.credentialfactory.azure.eventhub.sas.uri | quote }}
            - name: "DSE_CREDENTIAL-FACTORY_AZURE_EVENT-HUB_SAS_VALIDITY"
              value: {{ .Values.telemetryservice.credentialfactory.azure.eventhub.sas.validity | quote }}
            - name: "DSE_CREDENTIAL-FACTORY_AZURE_EVENT-HUB_SAS_KEY_NAME"
              value: {{ .Values.telemetryservice.credentialfactory.azure.eventhub.sas.key.name | required ".Values.telemetryservice.credentialfactory.azure.eventhub.sas.key.name is required" | quote }}
            - name: "DSE_CREDENTIAL-FACTORY_AZURE_EVENT-HUB_SAS_KEY_ALIAS"
              value: {{ .Values.telemetryservice.credentialfactory.azure.eventhub.sas.key.alias | required ".Values.telemetryservice.credentialfactory.azure.eventhub.sas.key.alias is required" | quote }}
          {{- else }}
            - name: "DSE_CREDENTIAL-FACTORY_AZURE_EVENT-HUB_CONNECTION-STRING_ALIAS"
              value: {{ .Values.telemetryservice.credentialfactory.azure.eventhub.connectionstring.alias | required ".Values.telemetryservice.credentialfactory.azure.eventhub.connectionstring.alias is required" | quote }}
          {{- end }}

            ################
            #    DID       #
            ################
            - name: "EDC_IAM_ISSUER_ID"
              value: {{ include "dse.telemetryservice.didWebUrl" . | quote }}
            - name: "EDC_IDENTITY_DID_URL"
              value: {{ include "dse.telemetryservice.didWebUrl" . | quote }}
            - name: "EDC_IAM_DID_WEB_USE_HTTPS"
              value: {{ include "dse.telemetryservice.didWebUseHttps" . | quote }}

            #####################
            # STS REMOTE CONFIG #
            #####################
            - name: "EDC_IAM_STS_OAUTH_TOKEN_URL"
              value: {{ include "dse.telemetryservice.sts.tokenUrl" . | quote }}
            - name: "EDC_IAM_STS_OAUTH_CLIENT_ID"
              value: {{ include "dse.telemetryservice.sts.clientId" . | quote }}
            - name: "EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS"
              value: {{ include "dse.telemetryservice.sts.clientSecretAlias" . | quote }}

            ################
            # ENCRYPTION   #
            ################
            # -- required since EDC 0.16.0's encryption-algorithm registry
            # (https://github.com/eclipse-edc/Connector/pull/5423); without it
            # participant-context creation fails.
            - name: "EDC_ENCRYPTION_AES_KEY_ALIAS"
              value: {{ include "dse.telemetryservice.keys.encryption.aesKeyAlias" . | quote }}

            #######
            # API #
            #######
            - name: "WEB_HTTP_MANAGEMENT_PORT"
              value: "8182"
            - name: "EDC_WEB_REST_CORS_ENABLED"
              value: {{ .Values.telemetryservice.api.cors.enabled | required ".Values.telemetryservice.api.cors.enabled is required" | quote }}
            - name: "EDC_WEB_REST_CORS_HEADERS"
              value: {{ .Values.telemetryservice.api.cors.allowedHeaders | required ".Values.telemetryservice.api.cors.allowedHeaders is required" | quote }}

          {{- range $key, $value := .Values.telemetryservice.envValueFrom }}
            - name: {{ $key | quote }}
              valueFrom:
                {{- tpl (toYaml $value) $ | nindent 16 }}
          {{- end }}
          {{- range $key, $value := .Values.telemetryservice.env }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
          {{- end }}
          {{- if and (or .Values.telemetryservice.envSecretNames .Values.telemetryservice.envConfigMapNames) (or (gt (len .Values.telemetryservice.envSecretNames) 0) (gt (len .Values.telemetryservice.envConfigMapNames) 0)) }}
          envFrom:
          {{- range $value := .Values.telemetryservice.envSecretNames }}
            - secretRef:
                name: {{ $value | quote }}
          {{- end }}
          {{- range $value := .Values.telemetryservice.envConfigMapNames }}
            - configMapRef:
                name: {{ $value | quote }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/logging.properties
              subPath: logging.properties
            - name: config
              mountPath: /app/opentelemetry.properties
              subPath: opentelemetry.properties
            - name: config
              mountPath: /app/config.properties
              subPath: config.properties
            - name: shared-volume
              readOnly: true
              mountPath: /shared
{{- if .Values.telemetryservice.internalTls.enabled }}
            - name: internal-tls-volume
              mountPath: /internal-certs
{{- end }}
{{- if and (eq (include "dse.telemetryservice.vaultAzureEnabled" .) "true") (or .Values.telemetryservice.vault.azure.credentials.secret.clientCertificateKey .Values.global.vault.azure.credentials.secret.clientCertificateKey) }}
            - name: azure-vault-cert-volume
              readOnly: true
              mountPath: /azure-vault-cert
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dse.fullname" . }}-config
            items:
            - key: logging.properties
              path: logging.properties
            - key: opentelemetry.properties
              path: opentelemetry.properties
            - key: config.properties
              path: config.properties
        - name: shared-volume
          emptyDir: { }
{{- if .Values.telemetryservice.internalTls.enabled }}
        - name: internal-tls-volume
          secret:
            secretName: {{ .Values.telemetryservice.internalTls.secretName }}
{{- end }}
{{- if and (eq (include "dse.telemetryservice.vaultAzureEnabled" .) "true") (or .Values.telemetryservice.vault.azure.credentials.secret.clientCertificateKey .Values.global.vault.azure.credentials.secret.clientCertificateKey) }}
        - name: azure-vault-cert-volume
          secret:
            secretName: {{ include "dse.telemetryservice.vaultAzureCredentialsSecretName" . | quote }}
            items:
              - key: {{ include "dse.telemetryservice.vaultAzureCredentialsClientCertificateKey" . | quote }}
                path: {{ include "dse.telemetryservice.vaultAzureCredentialsClientCertificateKey" . | quote }}
{{- end }}
      {{- with .Values.telemetryservice.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telemetryservice.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telemetryservice.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
