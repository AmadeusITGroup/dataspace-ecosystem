# -- Values shared across subcharts when this chart is deployed via the
# `participant` umbrella chart (Helm automatically injects `global` into every
# subchart's context). These provide sane cross-component defaults
# (release-name-derived URLs, image repository, JDBC URL, vault config) so the
# component-specific values below can be left empty. Any component-specific
# value set explicitly always takes precedence over what is derived from
# `global`.
global:
  participantName: ""
  environment: ""
  useHttps: null
  db:
    serverFqdn: ""
    name: ""
    credentials:
      secret:
        name: ""
  keys:
    # -- Vault alias of the shared AES key (Terraform's `aes_key_alias`,
    # "<participantName>-aes") used to encrypt participant-context config,
    # required since EDC 0.16.0's encryption-algorithm registry. Derived
    # from `global.participantName` when unset.
    aesKeyAlias: ""
  image:
    baseRepository: ""
    namePrefix: ""
  vaultProvider: ""
  identityHub:
    didWebUrl: ""
  authority:
    didWebUrl: ""
  vault:
    url: ""
  telemetry:
    enabled: false
    collectorEndpoint: ""

fullnameOverride: ""
nameOverride: ""
# -- Existing image pull secret to use to [obtain the container image from private registries](https://kubernetes.io/docs/concepts/containers/images/#using-a-private-registry)
imagePullSecrets:
- name: dockerconfigjson-github-com
# -- To add some custom labels
customLabels: {}

controlplane:
  image:
    # -- Docker repository for the Connector
    repository: ""
    # -- [Kubernetes image pull policy](https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy) to use
    pullPolicy: IfNotPresent
    # -- Image tag. Required — this chart does not set Chart.yaml appVersion,
    # so a tag must always be provided explicitly.
    tag: ""
  # -- Overrides the `app.kubernetes.io/instance` selector/label value
  # (normally derived from `.Release.Name`). Deployment/Service selectors are
  # immutable, so when migrating an existing Terraform-deployed participant
  # (whose standalone release was named "<participant>-controlplane") into
  # this umbrella chart (where `.Release.Name` is just "<participant>"), set
  # this to the old release name to avoid a selector change that would force
  # a Deployment delete+recreate. Leave empty for new deployments.
  instanceOverride: ""
  # -- Cert installer initContainer image

  initContainers: []
  livenessProbe:
    # -- Whether to enable kubernetes [liveness-probe](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
    enabled: true
    # -- seconds to wait before performing the first liveness check
    initialDelaySeconds: 0
    # -- this fields specifies that kubernetes should perform a liveness check every 10 seconds
    periodSeconds: 10
    # -- number of seconds after which the probe times out
    timeoutSeconds: 5
    # -- when a probe fails kubernetes will try 3 times before giving up
    failureThreshold: 3
    # -- number of consecutive successes for the probe to be considered successful after having failed
    successThreshold: 1
  startupProbe:
    enabled: true
    # -- seconds to wait before performing the first startup check
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
    successThreshold: 1
  readinessProbe:
    # -- Whether to enable kubernetes [readiness-probes](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
    enabled: true
    # -- seconds to wait before performing the first readiness check
    initialDelaySeconds: 0
    # -- this fields specifies that kubernetes should perform a readiness check every 10 seconds
    periodSeconds: 10
    # -- number of seconds after which the probe times out
    timeoutSeconds: 5
    # -- when a probe fails kubernetes will try 3 times before giving up
    failureThreshold: 3
    # -- number of consecutive successes for the probe to be considered successful after having failed
    successThreshold: 1
  # -- connector endpoints
  endpoints:
    # -- default api for health checks exposure, should not be added to any ingress
    default:
      # -- default api port
      port: 8080
      # -- default api path
      path: /api
    # -- data management api, used by internal users, can be added to an ingress and must not be internet facing
    management:
      # -- port for incoming api calls
      port: 8181
      # -- path for incoming api calls
      path: /api/management
    # -- dsp api, used for inter connector communication and must be internet facing
    protocol:
      # -- port for incoming api calls
      port: 8282
      # -- path for incoming api calls
      path: /api/dsp
    # -- control api, used for internal control calls. can be added to the internal ingress, but should probably not
    control:
      # -- port for incoming api calls
      port: 8383
      # -- path for incoming api calls
      path: /api/control

  # -- api configuration
  api:
    cors:
      # -- enable cross-origin request
      enabled: false
      # -- allowed headers for incoming calls
      allowedHeaders: "*"

  # -- Postgresql database configuration
  postgresql:
    schema:
      autocreate: true
    # -- jdbc url of the database
    jdbcUrl: ""
    credentials:
      secret:
        # -- name of the Kubernetes secret containing the PostgreSQL credentials.
        # Falls back to global.db.credentials.secret.name (participantName-derived
        # default) when unset.
        name: ""
        # -- secret key containing the username
        userKey: "username"
        # -- secret key containing the password
        passwordKey: "password"

  vault:
    # -- Hashicorp Vault
    hashicorp:
      url: ""
      cert:
        secretName: "tls-ca"
        tlsPath: "/shared/"
      token:
        renewal:
          # -- enable token renewal
          enabled: false
          renewBuffer: 30
          ttl: 300
        secret:
          # -- name of the Kubernetes secret containing the Hashicorp Vault token
          name: ""
          # -- secret key containing the token
          tokenKey: ""
      timeout: 30
      healthCheck:
        enabled: true
        standbyOk: true
      paths:
        secret: /v1/secret
        folder: ""
        health: /v1/sys/health
      # -- allow fallback to env-based vault token if participant-context token not available
      allowFallback: false


  # -- STS remote config
  sts:
    tokenUrl: ""
    clientId: ""
    clientSecretAlias: ""

  # -- Vault key aliases used for cryptographic operations other than the
  # STS signing key pair.
  keys:
    encryption:
      # -- Vault alias of the AES key used to encrypt participant-context
      # config, required since EDC 0.16.0's encryption-algorithm registry
      # (`edc.encryption.aes.key.alias`). Falls back to
      # global.keys.aesKeyAlias (participantName-derived default) when unset.
      aesKeyAlias: ""

  service:
    # -- [Service type](https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types) to expose the running application on a set of Pods as a network service.
    type: ClusterIP
    annotations: {}
    labels: {}
  # -- additional labels for the pod
  podLabels: {}
  # -- additional annotations for the pod
  podAnnotations: {}
  # -- The [pod security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod) defines privilege and access control settings for a Pod within the deployment
  podSecurityContext: {}
  # fsGroup: 2000
  # The [container security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container) defines privilege and access control settings for a Container within a pod
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
  # Extra environment variables that will be pass onto deployment pods
  env: {}
  #  ENV_NAME: value

  # "valueFrom" environment variable references that will be added to deployment pods. Name is templated.
  # ref: https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.19/#envvarsource-v1-core
  envValueFrom: {}
  #  ENV_NAME:
  #    configMapKeyRef:
  #      name: configmap-name
  #      key: value_key
  #    secretKeyRef:
  #      name: secret-name
  #      key: value_key

  # [Kubernetes Secret Resource](https://kubernetes.io/docs/concepts/configuration/secret/) names to load environment variables from
  envSecretNames: []
  #  - first-secret
  #  - second-secret

  # [Kubernetes ConfigMap Resource](https://kubernetes.io/docs/concepts/configuration/configmap/) names to load environment variables from
  envConfigMapNames: []
  #  - first-config-map
  #  - second-config-map

  # -- did:web: url resolving to the DID document
  did:
    web:
      url: ""
      # -- Whether DID Web resolution uses HTTPS. When unset, falls back to
      # global.useHttps and then false for standalone compatibility.
      useHttps: null

  # -- trusted issuers information
  trustedIssuers:
    authority:
      did: ""

  ## Ingress declaration to expose the network service.
  ingress:
    ## Public / Internet facing Ingress
    enabled: true
    # -- The hostname to be used to precisely map incoming traffic onto the underlying network service
    hostname: ""
    # -- Additional ingress annotations to add
    annotations: {}
    # -- EDC endpoints exposed by this ingress resource
    endpoints:
    # -- ingress for protocol api
    - port: 8282
      path: /api/dsp
    # -- Defines the [ingress class](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class)  to use
    className: ""
    # -- TLS [tls class](https://kubernetes.io/docs/concepts/services-networking/ingress/#tls) applied to the ingress resource
    tls:
      # -- Enables TLS on the ingress resource
      enabled: false
      # -- If present overwrites the default secret name
      secretName: ""
    ## Adds [cert-manager](https://cert-manager.io/docs/) annotations to the ingress resource
    certManager:
      # -- If preset enables certificate generation via cert-manager namespace scoped issuer
      issuer: ""
      # -- If preset enables certificate generation via cert-manager cluster-wide issuer
      clusterIssuer: ""
  internalTls:
    # -- Enable internal pod-to-pod TLS. When false, HTTP is used for pod-to-pod communication.
    enabled: true
    # -- Name of the Kubernetes secret containing tls.crt, tls.key, ca.crt for pod-to-pod TLS
    secretName: "internal-service-tls"
  # -- declare where to mount [volumes](https://kubernetes.io/docs/concepts/storage/volumes/) into the container
  volumeMounts: []
  # -- [volume](https://kubernetes.io/docs/concepts/storage/volumes/) directories
  volumes: []
  # -- [resource management](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/) for the container
  resources: {}
  # Recommended production values (no CPU limit to avoid JVM throttling under burst workloads):
  # requests:
  #   cpu: 500m
  #   memory: 512Mi
  replicaCount: 1
  autoscaling:
    # -- Enables [horizontal pod autoscaling](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/)
    enabled: false
    # -- Minimal replicas if resource consumption falls below resource threshholds
    minReplicas: 1
    # -- Maximum replicas if resource consumption exceeds resource threshholds
    maxReplicas: 100
    # -- targetAverageUtilization of cpu provided to a pod
    targetCPUUtilizationPercentage: 80
    # -- targetAverageUtilization of memory provided to a pod
    targetMemoryUtilizationPercentage: 80
  # -- configuration of the [Open Telemetry Agent](https://opentelemetry.io/docs/instrumentation/java/automatic/agent-config/) to collect and expose metrics
  opentelemetry: |-
    otel.javaagent.enabled=false
    otel.javaagent.debug=false
  # -- configuration of the [Java Util Logging Facade](https://docs.oracle.com/javase/7/docs/technotes/guides/logging/overview.html)
  logging: |-
    .level=INFO
    org.eclipse.edc.level=ALL
    handlers=java.util.logging.ConsoleHandler
    java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
    java.util.logging.ConsoleHandler.level=INFO
    java.util.logging.SimpleFormatter.format=[%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS] [%4$-7s] %5$s%6$s%n
  # -- control plane config
  config: ""
  # [node selector](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector) to constrain pods to nodes
  nodeSelector: {}
  # [tolerations](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/) to configure preferred nodes
  tolerations: []
  # [affinity](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity) to configure which nodes the pods can be scheduled on
  affinity: {}
  url: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # -- Existing image pull secret bound to the service account to use to [obtain the container image from private registries](https://kubernetes.io/docs/concepts/containers/images/#using-a-private-registry)
  imagePullSecrets: []

# -- Configurations for Helm tests
tests:
  # -- Configure the hook-delete-policy for Helm tests
  hookDeletePolicy: before-hook-creation,hook-succeeded
