{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kafka-proxy.fullname" . }}
  namespace: {{ include "kafka-proxy.targetNamespace" . }}
  labels:
    {{- include "kafka-proxy.labels" . | nindent 4 }}
rules:
{{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kafka-proxy.fullname" . }}
  namespace: {{ include "kafka-proxy.targetNamespace" . }}
  labels:
    {{- include "kafka-proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kafka-proxy.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kafka-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if ne (include "kafka-proxy.targetNamespace" .) .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kafka-proxy.fullname" . }}-manager-pod-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-proxy.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kafka-proxy.fullname" . }}-manager-pod-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-proxy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kafka-proxy.fullname" . }}-manager-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "kafka-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}