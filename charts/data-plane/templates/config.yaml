apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dse.fullname" . }}-config
  labels:
    {{- include "dse.labels" . | nindent 4 }}
data:

  logging.properties: |-
    {{- .Values.dataplane.logging | nindent 4 }}

  opentelemetry.properties: |-
    {{- include "dse.dataplane.opentelemetryProperties" . | nindent 4 }}

  config.properties: |-
    {{- include "dse.dataplane.configProperties" . | nindent 4 }}