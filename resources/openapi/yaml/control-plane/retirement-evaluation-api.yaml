openapi: 3.0.1
info:
  description: With this API clients can retire an active Contract Agreement. Clients
    can also list all retired agreements.
  title: Agreements Retirement API
security:
- bearerAuth: []
- apiKeyAuth: []
paths:
  /v4/contractagreements/retirements:
    post:
      description: Retires an active contract agreement.
      operationId: retireAgreementV4
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetirementExample"
      responses:
        "204":
          description: The contract agreement was successfully retired
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: Request body was malformed
        "409":
          description: The contract agreement is already retired
      tags:
      - Agreements Retirement
  /v4/contractagreements/retirements/request:
    post:
      description: Get all retired contract agreements.
      operationId: getAllRetiredV4
      requestBody:
        content:
          application/json:
            schema:
              $ref: https://w3id.org/edc/connector/management/schema/v4/query-spec-schema.json
        description: Optional QuerySpec (no body = all entries). A present body must
          have the compact @type QuerySpec (management v4).
      responses:
        "200":
          description: A list of retired contract agreements
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: Request body was malformed
      tags:
      - Agreements Retirement
  /v4/contractagreements/retirements/{agreementId}:
    delete:
      description: "Removes a contract agreement from the retired list, reactivating\
        \ it."
      operationId: reactivateRetiredV4
      parameters:
      - description: The contract agreement id
        in: path
        name: agreementId
        required: true
        schema:
          type: string
      responses:
        "204":
          description: The contract agreement is reactivated
        "400":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiErrorDetail"
          description: Request body was malformed
        "404":
          description: No entry for the given agreementId was found
      tags:
      - Agreements Retirement
components:
  schemas:
    ApiErrorDetail:
      type: object
      properties:
        invalidValue:
          type: object
        message:
          type: string
        path:
          type: string
        type:
          type: string
    JsonArray:
      type: array
      items:
        $ref: "#/components/schemas/JsonValue"
      properties:
        empty:
          type: boolean
        valueType:
          type: string
          enum:
          - ARRAY
          - OBJECT
          - STRING
          - NUMBER
          - "TRUE"
          - "FALSE"
          - "NULL"
    JsonObject:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      properties:
        empty:
          type: boolean
        valueType:
          type: string
          enum:
          - ARRAY
          - OBJECT
          - STRING
          - NUMBER
          - "TRUE"
          - "FALSE"
          - "NULL"
    JsonValue:
      type: object
      properties:
        valueType:
          type: string
          enum:
          - ARRAY
          - OBJECT
          - STRING
          - NUMBER
          - "TRUE"
          - "FALSE"
          - "NULL"
    RetirementExample:
      type: object
      example:
        '@context':
          dse: https://w3id.org/dse/v0.0.1/ns/
          edc: https://w3id.org/edc/v0.0.1/ns/
        '@type': AgreementsRetirementEntry
        edc:agreementId: contract-agreement-id
        dse:reason: This contract agreement was retired since the physical counterpart
          is no longer valid.
      properties:
        '@context':
          type: object
        '@type':
          type: string
          enum:
          - AgreementsRetirementEntry
        dse:reason:
          type: string
        edc:agreementId:
          type: string
      required:
      - '@context'
      - '@type'
      - dse:reason
      - edc:agreementId
  securitySchemes:
    apiKeyAuth:
      in: header
      name: x-api-key
      type: apiKey
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
